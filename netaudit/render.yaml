# Render.com blueprint — one canonical cloud netaudit server.
# Deploy: push this repo, then on render.com "New > Blueprint" and pick it.
# After it's up, set NETAUDIT_TOKEN to a strong secret in the dashboard.
services:
  - type: web
    name: netaudit
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # needs a paid plan for a persistent disk
    healthCheckPath: /api/ping
    envVars:
      - key: NETAUDIT_TOKEN
        sync: false          # set this yourself in the dashboard (a long random secret)
      - key: NETAUDIT_HOME
        value: /data
    disk:
      name: netaudit-data
      mountPath: /data       # persists engagements + evidence across restarts
      sizeGB: 1
