<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1220">
<title>netaudit</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0b1220; --panel:#121a2b; --panel2:#1b2540; --line:#243150;
  --txt:#e7ecf6; --muted:#8ea0c4; --accent:#4f9cff; --ok:#33c187; --warn:#f0b03a;
  --crit:#ff5a5a; --high:#ff8a3d; --med:#f0b03a; --low:#5cc8ff; --info:#8ea0c4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);overflow-x:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{color:var(--muted);font-size:12px}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.academy-link{border:1px solid var(--line);background:var(--panel2);color:var(--txt);text-decoration:none;
  padding:6px 9px;border-radius:10px;font-size:12px;font-weight:700}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.no{color:var(--crit);border-color:var(--crit)}
main{padding:14px 14px 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
button,.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);border-color:var(--accent);color:#071324}
button.ghost{background:transparent}
button.sm{padding:7px 10px;font-size:13px;font-weight:600}
input,select,textarea{width:100%;background:#0d1426;border:1px solid var(--line);color:var(--txt);
  padding:11px;border-radius:10px;font-size:15px;margin:4px 0 8px}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-top:6px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.bar{height:8px;background:#0d1426;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent)}
.phase-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.phase-row:last-child{border-bottom:none}
.phase-row .nm{flex:1;min-width:0}
.phase-row .nm b{font-weight:600;font-size:14px}
.chk{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;background:#0d1426}
.chk.done{background:var(--ok);border-color:var(--ok);color:#06251a}
.chk.in_progress{background:var(--warn);border-color:var(--warn);color:#2a1c03}
.chk.na{background:#2a3350;border-color:#2a3350;color:var(--muted)}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.sev-critical{background:var(--crit);color:#2a0606}.sev-high{background:var(--high);color:#2a1303}
.sev-medium{background:var(--med);color:#2a1c03}.sev-low{background:var(--low);color:#04222e}
.sev-info{background:#2a3350;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
nav button{background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;flex:1 1 0;min-width:0;overflow:hidden}
nav button .ic{font-size:18px}
nav button .nav-label{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
nav button.active{color:var(--accent)}
pre{white-space:pre-wrap;word-break:break-word;background:#0d1426;border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:12.5px;overflow-x:auto;max-height:60vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0d1426;border:1px solid var(--line);
  color:var(--txt);padding:10px 16px;border-radius:24px;font-size:13px;z-index:20;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.toast.err{border-color:var(--crit);color:#ffd2d2}
.hidden{display:none!important}
.tag{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0}
.tag b{color:var(--txt);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%}.dot.ok{background:var(--ok)}.dot.no{background:var(--crit)}
a{color:var(--accent)}
@media(max-width:420px){nav button{font-size:10px;padding-inline:1px}nav button .ic{font-size:16px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>netaudit</h1>
    <div class="sub" id="hsub">engagement control</div>
  </div>
  <div class="header-actions">
    <a class="academy-link" href="./academy.html">Academy</a>
    <span class="badge" id="authBadge">—</span>
  </div>
</header>

<main id="view"></main>

<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
const API = (p,opt={}) => fetch('/api'+p,{...opt,
  headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN,...(opt.headers||{})}})
  .then(async r=>{const t=await r.text();let j;try{j=t?JSON.parse(t):{}}catch{j={raw:t}}
    if(!r.ok)throw new Error(j.error||r.status);return j;});

let TOKEN = localStorage.getItem('netaudit_token')||'';
const urlTok = new URLSearchParams(location.search).get('token');
if(urlTok){TOKEN=urlTok;localStorage.setItem('netaudit_token',TOKEN);
  history.replaceState({},'',location.pathname);}

let STATE={tab:'engagements',engId:localStorage.getItem('netaudit_eng')||null,eng:null,tmpl:null};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');
  setTimeout(()=>t.className='toast',2600);}

const TABS=[
 {id:'engagements',ic:'▦',label:'Jobs'},
 {id:'phases',ic:'☑',label:'Phases'},
 {id:'scope',ic:'◎',label:'Scope'},
 {id:'findings',ic:'⚑',label:'Findings'},
 {id:'run',ic:'⚡',label:'Run'},
 {id:'report',ic:'▤',label:'Report'},
];

function renderNav(){
  $('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t.id}" class="${STATE.tab===t.id?'active':''}">
    <span class="ic">${t.ic}</span><span class="nav-label">${t.label}</span></button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.tab!=='engagements'&&!STATE.engId){toast('Pick or create a job first');return;}
    STATE.tab=b.dataset.tab;render();});
}

async function loadTemplate(){if(!STATE.tmpl)STATE.tmpl=await API('/template');}
async function loadEng(){if(STATE.engId){STATE.eng=await API('/engagements/'+STATE.engId);}}

function setBadge(){const b=$('#authBadge');
  if(!STATE.eng){b.className='badge';b.textContent='—';return;}
  const g=STATE.eng.authorization.granted;
  b.className='badge '+(g?'ok':'no');b.textContent=g?'AUTHORIZED':'NOT AUTHORIZED';}

async function render(){
  renderNav();
  if(!TOKEN){return renderToken();}
  try{
    await loadTemplate();
    if(STATE.engId&&STATE.tab!=='engagements')await loadEng();
    if(STATE.engId&&STATE.tab==='engagements')await loadEng();
  }catch(e){return renderToken(e.message);}
  setBadge();
  $('#hsub').textContent=STATE.eng?STATE.eng.name:'engagement control';
  ({engagements:viewEngagements,phases:viewPhases,scope:viewScope,
    findings:viewFindings,run:viewRun,report:viewReport}[STATE.tab]||viewEngagements)();
}

function renderToken(err){
  $('#view').innerHTML=`<div class="card"><h2>Access token</h2>
   <p class="tiny muted">Paste the token printed by <code>netaudit serve</code>
   (or open the URL it printed, which includes <code>?token=…</code>).</p>
   ${err?`<p class="tiny" style="color:var(--crit)">${esc(err)}</p>`:''}
   <input id="tok" placeholder="token" value="${esc(TOKEN)}">
   <button class="primary" onclick="saveTok()">Connect</button></div>`;
}
window.saveTok=()=>{TOKEN=$('#tok').value.trim();localStorage.setItem('netaudit_token',TOKEN);render();};

// ---- Engagements ----
async function viewEngagements(){
  const {engagements}=await API('/engagements');
  $('#view').innerHTML=`
   <div class="card"><h2>New engagement</h2>
     <label>Name</label><input id="e_name" placeholder="acme-q2">
     <label>Client</label><input id="e_client" placeholder="Acme Corp">
     <label>SOW ref</label><input id="e_sow" placeholder="SOW-2026-014">
     <button class="primary" onclick="createEng()">Create</button>
   </div>
   <div class="card"><h2>Engagements (${engagements.length})</h2>
   ${engagements.length?engagements.map(e=>`
     <div class="list-item">
       <div style="flex:1">
         <b>${esc(e.name)}</b><br>
         <span class="tiny muted">${esc(e.client||'no client')} · ${esc(e.id)}</span><br>
         <span class="pill ${e.authorization&&e.authorization.signed?'sev-low':'sev-critical'}">
           ${e.authorization&&e.authorization.signed?'auth':'no auth'}</span>
       </div>
       <button class="sm ${STATE.engId===e.id?'primary':''}" onclick="pickEng('${e.id}')">
         ${STATE.engId===e.id?'current':'open'}</button>
     </div>`).join(''):'<p class="muted tiny">None yet.</p>'}
   </div>
   ${STATE.eng?authCard():''}`;
}
function authCard(){const a=STATE.eng.authorization;return `
 <div class="card"><h2>Phase 0 — Authorization gate</h2>
  <p class="tiny muted">Active tooling stays blocked until this is granted (signed + officer + letter)
   and the Phase 0 checklist is complete.</p>
  <label>Authorizing officer</label><input id="a_off" value="${esc(a.authorizing_officer)}">
  <label>Signed date</label><input id="a_date" value="${esc(a.signed_date)}" placeholder="2026-06-14">
  <label>Get-out-of-jail letter path</label><input id="a_letter" value="${esc(a.letter_path)}" placeholder="/secure/auth.pdf">
  <div class="row"><label style="margin:0">Signed authorization on file</label><div class="spacer"></div>
    <button class="sm ${a.signed?'primary':''}" onclick="setGrant(${!a.signed})">${a.signed?'YES':'mark signed'}</button></div>
  <button class="primary" style="margin-top:10px" onclick="saveAuth()">Save authorization</button>
 </div>`;}
window.createEng=async()=>{const name=$('#e_name').value.trim();if(!name)return toast('name required');
  const e=await API('/engagements',{method:'POST',body:JSON.stringify(
    {name,client:$('#e_client').value,sow:$('#e_sow').value})});
  pickEng(e.id);toast('Created '+e.name);};
window.pickEng=async(id)=>{STATE.engId=id;localStorage.setItem('netaudit_eng',id);await loadEng();render();};
window.setGrant=async(v)=>{STATE.eng.authorization.signed=v;
  await API('/engagements/'+STATE.engId+'/authorize',{method:'POST',body:JSON.stringify({grant:v})});await loadEng();render();};
window.saveAuth=async()=>{await API('/engagements/'+STATE.engId+'/authorize',{method:'POST',
  body:JSON.stringify({officer:$('#a_off').value,date:$('#a_date').value,letter:$('#a_letter').value})});
  await loadEng();render();toast('Authorization saved');};

// ---- Phases / checklist ----
const NEXT={pending:'in_progress',in_progress:'done',done:'na',na:'pending'};
const GLYPH={pending:'',in_progress:'~',done:'✓',na:'–'};
async function viewPhases(){
  const prog=STATE.eng.progress;
  const overall=STATE.tmpl.phases.map(p=>{const pr=prog[p.number];
    return `<div class="phase-row" onclick="openPhase(${p.number})">
      <div class="nm"><b>P${p.number} · ${esc(p.name)}</b>${p.optional?' <span class="tiny muted">(optional)</span>':''}
        <div class="bar" style="margin-top:6px"><i style="width:${pr.percent}%"></i></div></div>
      <span class="tiny muted">${pr.done}/${pr.total}</span></div>`;}).join('');
  const qaDone=STATE.tmpl.qa.filter(q=>STATE.eng.qa[q.id]).length;
  $('#view').innerHTML=`
   <div class="card"><h2>Phase progress</h2>${overall}</div>
   <div id="phaseDetail"></div>
   <div class="card"><h2>Final QA recheck (${qaDone}/${STATE.tmpl.qa.length})</h2>
     ${STATE.tmpl.qa.map(q=>`<div class="phase-row" onclick="toggleQA('${q.id}',${!STATE.eng.qa[q.id]})">
       <div class="chk ${STATE.eng.qa[q.id]?'done':''}">${STATE.eng.qa[q.id]?'✓':''}</div>
       <div class="nm tiny">${esc(q.text)}</div></div>`).join('')}</div>`;
}
window.openPhase=(n)=>{const p=STATE.tmpl.phases.find(x=>x.number===n);
  $('#phaseDetail').innerHTML=`<div class="card"><h2>P${n} · ${esc(p.name)}</h2>
   <p class="tiny muted">${esc(p.intent)} · tap a box to cycle pending → in&nbsp;progress → done → n/a</p>
   ${p.items.map(it=>{const st=(STATE.eng.checklist[it.id]||{}).state||'pending';
     return `<div class="phase-row">
       <div class="chk ${st}" onclick="cycle('${it.id}','${st}')">${GLYPH[st]}</div>
       <div class="nm tiny">${esc(it.text)}<br><span class="muted">${it.id}</span></div></div>`;}).join('')}
   <p class="tiny muted" style="margin-top:8px">Tools: ${p.tools.map(esc).join(' · ')}</p></div>`;
  $('#phaseDetail').scrollIntoView({behavior:'smooth',block:'start'});};
window.cycle=async(id,st)=>{const next=NEXT[st];
  await API('/engagements/'+STATE.engId+'/check',{method:'POST',body:JSON.stringify({item_id:id,state:next})});
  await loadEng();const open=$('#phaseDetail').querySelector('h2');
  viewPhases();if(open){const n=parseInt(open.textContent.match(/P(\d+)/)[1]);openPhase(n);} };
window.toggleQA=async(id,v)=>{await API('/engagements/'+STATE.engId+'/qa',{method:'POST',
  body:JSON.stringify({qa_id:id,value:v})});await loadEng();viewPhases();};

// ---- Scope ----
async function viewScope(){const s=STATE.eng.scope;
  $('#view').innerHTML=`
   <div class="card"><h2>Scope check</h2>
     <input id="sc_t" placeholder="192.168.1.50 or host">
     <button class="primary" onclick="scopeCheck()">Check target</button>
     <div id="sc_res" class="tiny" style="margin-top:8px"></div></div>
   <div class="card"><h2>Add</h2>
     <input id="sc_add" placeholder="192.168.1.0/24, host, 10.0.0.1-20">
     <div class="row"><button class="primary" onclick="scopeAdd('add')">In scope</button>
       <button onclick="scopeAdd('exclude')">Exclude</button></div></div>
   <div class="card"><h2>In scope (${s.in_scope.length})</h2>
     ${s.in_scope.map(t=>`<span class="tag"><b>${esc(t)}</b>
       <span onclick="scopeRemove('${esc(t)}')" style="cursor:pointer">✕</span></span>`).join('')||'<span class="muted tiny">none</span>'}</div>
   <div class="card"><h2>Exclusions (${s.exclusions.length})</h2>
     ${s.exclusions.map(t=>`<span class="tag"><b>${esc(t)}</b>
       <span onclick="scopeRemove('${esc(t)}')" style="cursor:pointer">✕</span></span>`).join('')||'<span class="muted tiny">none</span>'}</div>`;
}
window.scopeCheck=async()=>{const t=$('#sc_t').value.trim();if(!t)return;
  const r=await API('/engagements/'+STATE.engId+'/scope/check?target='+encodeURIComponent(t));
  $('#sc_res').innerHTML=`<span style="color:${r.allowed?'var(--ok)':'var(--crit)'}">
    ${r.allowed?'ALLOWED':'BLOCKED'}: ${esc(r.reason)}</span>`;};
window.scopeAdd=async(action)=>{const v=$('#sc_add').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!v.length)return;await API('/engagements/'+STATE.engId+'/scope',{method:'POST',
    body:JSON.stringify({action,targets:v})});await loadEng();viewScope();toast('Scope updated');};
window.scopeRemove=async(t)=>{await API('/engagements/'+STATE.engId+'/scope',{method:'POST',
  body:JSON.stringify({action:'remove',targets:[t]})});await loadEng();viewScope();};

// ---- Findings ----
async function viewFindings(){const f=STATE.eng.findings;
  $('#view').innerHTML=`
   <div class="card"><h2>Add finding</h2>
     <label>Title</label><input id="f_title">
     <label>Severity</label><select id="f_sev">
       ${['critical','high','medium','low','info'].map(s=>`<option>${s}</option>`).join('')}</select>
     <label>Host</label><input id="f_host">
     <label>CVSS</label><input id="f_cvss" placeholder="7.5">
     <label>Business impact</label><textarea id="f_impact"></textarea>
     <label>Remediation</label><textarea id="f_rem"></textarea>
     <button class="primary" onclick="addFinding()">Add finding</button></div>
   <div class="card"><h2>Findings (${f.length})</h2>
   ${f.length?f.map(x=>`<div class="list-item">
     <span class="pill sev-${x.severity}">${x.severity}</span>
     <div style="flex:1"><b>${esc(x.title)}</b><br>
       <span class="tiny muted">${esc(x.host||'—')} ${x.cvss?'· CVSS '+esc(x.cvss):''}</span></div>
     </div>`).join(''):'<p class="muted tiny">none</p>'}</div>`;
}
window.addFinding=async()=>{const title=$('#f_title').value.trim();if(!title)return toast('title required');
  await API('/engagements/'+STATE.engId+'/findings',{method:'POST',body:JSON.stringify({
    title,severity:$('#f_sev').value,host:$('#f_host').value,cvss:$('#f_cvss').value,
    business_impact:$('#f_impact').value,remediation:$('#f_rem').value})});
  await loadEng();viewFindings();toast('Finding added');};

// ---- Runner ----
async function viewRun(){const {runners}=await API('/runners');
  const blocked=!STATE.eng.authorization.granted||(STATE.eng.progress['0'].percent<100);
  $('#view').innerHTML=`
   <div class="card"><h2>Scope-guarded runner</h2>
     ${blocked?`<p class="tiny" style="color:var(--warn)">Runner is gated: needs authorization granted
       AND Phase 0 100% complete. You can still preview (dry-run) commands.</p>`:''}
     <label>Target (must be in scope)</label><input id="r_t" placeholder="192.168.1.50">
     <label>Runner</label><select id="r_name">
       ${runners.map(r=>`<option value="${r.name}" ${r.installed?'':'disabled'}>
         ${r.name} · P${r.phase} ${r.installed?'':'(not installed)'}</option>`).join('')}</select>
     <div class="row"><button onclick="doRun(false)">Preview (dry-run)</button>
       <button class="primary" onclick="doRun(true)">Execute</button></div>
     <pre id="r_out" class="hidden"></pre></div>
   <div class="card"><h2>Available runners</h2>
     <p class="tiny muted">Discovery / enumeration / read-only only. Exploitation &amp; cracking stay manual.</p>
     ${runners.map(r=>`<div class="phase-row">
       <span class="dot ${r.installed?'ok':'no'}"></span>
       <div class="nm tiny"><b>${esc(r.name)}</b> · P${r.phase}<br>
         <span class="muted">${esc(r.desc)}</span></div></div>`).join('')}</div>`;
}
window.doRun=async(execute)=>{const target=$('#r_t').value.trim();const runner=$('#r_name').value;
  if(!target)return toast('target required');
  const out=$('#r_out');out.className='';out.textContent='running…';
  try{const res=await API('/engagements/'+STATE.engId+'/run',{method:'POST',
      body:JSON.stringify({runner,target,execute})});
    if(res.executed){out.textContent=`$ ${res.command}\n\nrc=${res.return_code}\nevidence: ${res.evidence_id}\nsaved: ${res.output_path}`;
      toast('Executed · evidence saved');}
    else{out.textContent=`DRY RUN (not executed)\n\nwould run:\n$ ${res.command}`;}
  }catch(e){out.textContent='BLOCKED: '+e.message;toast(e.message,true);} };

// ---- Report ----
async function viewReport(){
  const md=await API('/engagements/'+STATE.engId+'/report');
  const text=md.raw!==undefined?md.raw:md;
  $('#view').innerHTML=`<div class="card"><h2>Markdown report</h2>
    <div class="row"><button class="sm" onclick="copyReport()">Copy</button>
      <button class="sm" onclick="dlReport()">Download .md</button></div>
    <pre id="rep">${esc(text)}</pre></div>`;
  window._rep=text;
}
window.copyReport=()=>{navigator.clipboard.writeText(window._rep).then(()=>toast('Copied'));};
window.dlReport=()=>{const b=new Blob([window._rep],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(STATE.eng.name||'report')+'.md';a.click();};

render();
</script>
</body>
</html>
