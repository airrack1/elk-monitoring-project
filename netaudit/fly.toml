# Fly.io config. Deploy:
#   fly launch --no-deploy            # creates the app (accept this fly.toml)
#   fly volume create netaudit_data --size 1
#   fly secrets set NETAUDIT_TOKEN=$(python -c "import secrets;print(secrets.token_urlsafe(24))")
#   fly deploy
app = "netaudit"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NETAUDIT_HOME = "/data"
  PORT = "8765"

[[mounts]]
  source = "netaudit_data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/ping"
    interval = "30s"
    timeout = "5s"
