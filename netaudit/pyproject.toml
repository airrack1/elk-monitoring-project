[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netaudit"
version = "0.1.0"
description = "Scope-aware engagement workflow automation for network security audits (NetSec Assessments checklist)."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Aaryon" }]
license = { text = "Proprietary — internal NetSec Assessments use" }
dependencies = []

[project.scripts]
netaudit = "netaudit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["netaudit*"]

[tool.setuptools.package-data]
netaudit = ["data/*.py"]
