name: netaudit CI

# Runs the test suite + Docker build on every push/PR, then (optionally)
# auto-deploys the cloud server when you've configured a deploy hook.
on:
  push:
    branches: ["**"]
    paths: ["netaudit/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["netaudit/**", ".github/workflows/ci.yml"]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: netaudit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev deps)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  docker-build:
    # Make sure the cloud image actually builds before we'd ever deploy it.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t netaudit:ci .

  deploy:
    # Auto-deploy the canonical cloud server. No-ops (cleanly) until you add a
    # RENDER_DEPLOY_HOOK secret, so it's safe to have on from day one.
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push'
    defaults:
      run:
        # This job intentionally does not check out the repository. Override
        # the workflow-wide `netaudit` directory so Bash starts successfully.
        working-directory: .
    steps:
      - name: Trigger cloud deploy (Render deploy hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret set — skipping deploy."
            echo "Add one in repo Settings > Secrets to enable auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered cloud deploy."
